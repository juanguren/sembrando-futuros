<!doctype html>
<!-- data-tema fija la dirección por defecto y evita el parpadeo inicial;
     src/tools/theme-explorer.js la sobreescribe con la elección guardada. -->
<html lang="es" data-tema="fogata">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO. El texto debe coincidir con `sitio` en src/content.js. Va estático
         en el HTML (no por JS) para que los crawlers y los previews de
         WhatsApp/Instagram —el canal por el que se comparte tras el QR— lo lean. -->
    <meta
      name="description"
      content="Festival colombiano de esperanza, educación y diversión alrededor de las semillas nativas de nuestros territorios y nuestras comunidades. ¡Únete a sembrar!"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph / Twitter — preview al compartir el enlace. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sembrando futuros" />
    <meta property="og:locale" content="es_CO" />
    <meta
      property="og:title"
      content="sembrando-futuros - cultivando esperanza y diversión"
    />
    <meta
      property="og:description"
      content="Festival colombiano de esperanza, educación y diversión alrededor de las semillas nativas de nuestros territorios y nuestras comunidades. ¡Únete a sembrar!"
    />
    <!-- Al tener dominio, añade:  <meta property="og:url" content="https://…" />
         Para que el preview muestre imagen, agrega un JPG/PNG de 1200×630 en
         /public y descomenta:
    <meta property="og:image" content="/og-image.jpg" /> -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="sembrando-futuros - cultivando esperanza y diversión"
    />
    <meta
      name="twitter:description"
      content="Festival colombiano de esperanza, educación y diversión alrededor de las semillas nativas de nuestros territorios y nuestras comunidades. ¡Únete a sembrar!"
    />
    <!-- Tipografías de los dos temas: Space Grotesk (Solarpunk), Fraunces
         (Animista-futurista) y DM Sans, el texto corrido de ambos. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>sembrando-futuros - cultivando esperanza y diversión</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/pages/home.js"></script>
  </body>
</html>
