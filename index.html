<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO. El texto debe coincidir con `sitio` en src/content.js. Va estático
         en el HTML (no por JS) para que los crawlers y los previews de
         WhatsApp/Instagram —el canal por el que se comparte tras el QR— lo lean. -->
    <meta
      name="description"
      content="Recibiste semillas nativas de la sabana de Bogotá. Aquí te contamos qué son y cómo sembrarlas."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph / Twitter — preview al compartir el enlace. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sembrando futuros" />
    <meta property="og:locale" content="es_CO" />
    <meta
      property="og:title"
      content="sembrando futuros — un puñado de futuro en tus manos"
    />
    <meta
      property="og:description"
      content="Recibiste semillas nativas de la sabana de Bogotá. Aquí te contamos qué son y cómo sembrarlas."
    />
    <!-- Al tener dominio, añade:  <meta property="og:url" content="https://…" />
         Para que el preview muestre imagen, agrega un JPG/PNG de 1200×630 en
         /public y descomenta:
    <meta property="og:image" content="/og-image.jpg" /> -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="sembrando futuros — un puñado de futuro en tus manos"
    />
    <meta
      name="twitter:description"
      content="Recibiste semillas nativas de la sabana de Bogotá. Aquí te contamos qué son y cómo sembrarlas."
    />
    <!-- Tipografías.
         v1 (default): Cormorant Garamond (display) + DM Sans (cuerpo).
         Temas de exploración: Fraunces (Noche), Spectral (Oro), Space Grotesk
         (Jardín). Al elegir dirección, quitar de aquí las familias que no se
         usen — cargar 5 familias es solo para poder comparar en vivo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Spectral:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>sembrando futuros</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
